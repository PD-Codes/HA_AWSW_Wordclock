; WordClock 16x16 - custom firmware for the AWSW WordClock hardware (ESP32, WS2812B on GPIO32)

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = min_spiffs.csv
lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.3
    tzapu/WiFiManager@^2.0.17
    bblanchon/ArduinoJson@^7.2.0

; Uncomment for over-the-air uploads after the first USB flash:
; upload_protocol = espota
; upload_port = wordclock.local
